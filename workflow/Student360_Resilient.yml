    - id: report_format
      type: custom
      width: 260
      height: 130
      position:
        x: 11520
        y: 80
      positionAbsolute:
        x: 11520
        y: 80
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: Create the parent progress report
        desc: Show the answer first, report details next, and each source once at the end. Full evidence and review submissions remain in the workflow record.
        selected: false
        version: '1'
        code_language: python3
        code: "import re\n\n# Report labels per language. Order: 18 labels, 8 outcomes, 6 evidence, 8 review states, 5 changes.\nT = {\n\"en\": [\n\"Student Progress Report\",\n\"Your answer\",\n\"Teacher-approved plan\",\n\"Teacher-approved plan (translation)\",\n\"Information still needed\",\n\"Report details\",\n\"Student\",\n\"Request outcome\",\n\"Supporting information\",\n\"Review status\",\n\"Report language\",\n\"Review updates\",\n\"Sources\",\n\"Records checked\",\n\"School record reference\",\n\"Please confirm the student name\",\n\"These records do not yet establish the requested information.\",\n\"This is a translation of the reviewed original; the original wording remains in the review record.\",\n\"Progress answer ready\",\n\"School review\",\n\"Teacher review\",\n\"Student record not found\",\n\"Student name clarification needed\",\n\"Response ready\",\n\"School verified answer ready\",\n\"Learning plan approved\",\n\"School submission received; answer pending\",\n\"Supported by available records\",\n\"Confirmed from a school-verified record\",\n\"More information needed\",\n\"Supporting information needs verification\",\n\"Supporting information needs checking\",\n\"Answer awaiting another check\",\n\"No review required\",\n\"Teacher approved\",\n\"Plan not approved\",\n\"Review not completed in time\",\n\"Awaiting missing information\",\n\"School confirmed the answer\",\n\"Review needed\",\n\"Teacher updated the plan\",\n\"Teacher approved the proposed plan\",\n\"Supplied school record used\",\n\"Existing record confirmed\",\n\"School submission retained for checking\"\n],\n\"hi\": [\n\"विद्यार्थी प्रगति रिपोर्ट\",\n\"आपका उत्तर\",\n\"शिक्षक द्वारा स्वीकृत योजना\",\n\"शिक्षक द्वारा स्वीकृत योजना (अनुवाद)\",\n\"अभी भी आवश्यक जानकारी\",\n\"रिपोर्ट विवरण\",\n\"विद्यार्थी\",\n\"अनुरोध का परिणाम\",\n\"सहायक जानकारी\",\n\"समीक्षा स्थिति\",\n\"रिपोर्ट की भाषा\",\n\"समीक्षा में परिवर्तन\",\n\"स्रोत\",\n\"जाँचे गए रिकॉर्ड\",\n\"विद्यालय रिकॉर्ड संदर्भ\",\n