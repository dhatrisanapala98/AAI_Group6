        code: "import json,re,unicodedata\ndef read_model_object(raw):\n    text=str(raw or '').strip().lstrip('\\ufeff')\n    if text in {'__RECORD_CHECK_UNAVAILABLE__','__TRANSLATION_UNAVAILABLE__',''}:\n        raise ValueError('model_unavailable')\n    text=re.sub(r'<think>.*?</think>','',text,flags=re.I|re.S).strip()\n    if re.search(r'</?think>',text,re.I): raise ValueError('incomplete_model_response')\n    if text.startswith('```'):\n        text=re.sub(r'^```(?:json)?\\s*','',text,flags=re.I)\n        text=re.sub(r'\\s*```\\s*$','',text)\n    try:\n        value=json.loads(text)\n    except (ValueError,TypeError):\n        start=text.find('{')\n        if start<0: raise ValueError('invalid_json')\n        try: value,end=json.JSONDecoder().raw_decode(text[start:])\n        except ValueError: raise ValueError('invalid_json')\n        # Accept a single wrapped JSON object, never select between conflicting objects.\n        if re.search(r'[\\{\\[]',text[start+end:]): raise ValueError('multiple_json_objects')\n    if isinstance(value,str):\n        try: value=json.loads(value)\n        except ValueError: raise ValueError('invalid_json')\n    if not isinstance(value,dict): raise ValueError('model_object_required')\n    return value\ndef normalize_text(value):\n    value=unicodedata.normalize('NFKC',str(value))\n    value=value.translate(str.maketrans({'’':\"'\",'‘':\"'\",'“':'\"','”':'\"','–':'-','—':'-','−':'-'}))\n    return re.sub(r'\\s+',' ',value).strip()\ndef canonical_reference(value,allowed):\n    if not isinstance(value,str): raise ValueError('unknown_source_reference')\n    key=normalize_text(value).strip('[]').strip().casefold()\n    matches=[ref for ref in allowed if normalize_text(ref).strip('[]').strip().casefold()==key]\n    if len(matches)!=1: raise ValueError('unknown_source_reference')\n    return matches[0]\ndef parent_failure(code):\n    if code=='model_unavailable':\n        return 'The school record was received, but the answer service did not complete its check. Please retry the school review.'\n    if code in {'invalid_json','multiple_json_objects','model_object_required','incomplete_model_response','invalid_model_fields'}:\n        return 'The school record was received, but the answer could not be read reliably. Please retry the school review.'\n    if code in {'unknown_source_reference','quote_not_in_record','unknown_answer_reference'}:\n        return 'A supporting statement could not be matched to the referenced record. The school needs to check the record extract and reference.'\n    if code=='verified_source_not_used':\n        return 'The answer check did not use the school-verified record to establish the requested fact. The school needs to review the supporting record.'\n    return 'The submitted record has not yet established all the requested information. The school needs to complete its check before confirming the answer.'\n\ndef validate_record(raw: str, source_texts_json: str, question: str) -> dict:\n    def failed(code):\n        return {'enough_evidence':'no','evidence_status':'unverified','request_type':'unclassified',\n            'reason':parent_failure(code),'missing_information':'A source-supported answer to the question.',\n            'supporting_evidence':'','used_sources':'','validation_error':code}\n    try:\n        item=read_model_object(raw);docs=json.loads(source_texts_json)\n        if not isinstance(docs,dict): raise ValueError('invalid_source_map')\n        status=str(item.get('evidence_status') or '').strip().lower()\n        kind=str(item.get('request_type') or '').strip().lower()\n        if status not in {'sufficient','insufficient'} or kind not in {'factual','educational_recommendation'}:\n            raise ValueError('invalid_model_fields')\n        reason=item.get('reason');missing=item.get('missing_information')\n        if missing is None: missing=''\n        if not isinstance(reason,str) or not reason.strip() or not isinstance(missing,str): raise ValueError('invalid_model_fields')\n        if missing.strip().lower() in {'none','n/a','not applicable','no missing information','-'}: missing=''\n        facts=item.get('supporting_evidence')\n        if not isinstance(facts,list): raise ValueError('invalid_model_fields')\n        refs=[];clean=[]\n        for fact in facts:\n            if not isinstance(fact,dict): raise ValueError('invalid_model_fields')\n            ref=canonical_reference(fact.get('source'),docs)\n            quote=fact.get('quote');supports=fact.get('supports')\n            if not isinstance(quote,str) or len(quote.strip())<12 or not isinstance(supports,str) or not supports.strip():\n                raise ValueError('invalid_supporting_quote')\n            quote=quote.strip()\n            if len(quote)>2 and (quote[0],quote[-1]) in {('\"','\"'),('“','”'),(\"'\",\"'\")}:\n                quote=quote[1:-1].strip()\n            if not any(normalize_text(quote) in normalize_text(text) for text in docs[ref]): raise ValueError('quote_not_in_record')\n            clean.append({'source':ref,'quote':quote,'supports':supports})\n            if ref not in refs: refs.append(ref)\n        if status=='sufficient' and (not clean or missing.strip()): raise ValueError('incomplete_supporting_evidence')\n        if status=='insufficient' and not missing.strip(): missing='The specific readable record needed to answer this question.'\n        if re.search(r'\\b(?:create|make|design|draft|build|propose|request|recommend|provide|suggest|give|develop)\\b.{0,100}\\b(?:plan|routine|schedule)\\b|\\bwhat\\s+should\\b|\\bhow\\s+can\\b.{0,80}\\bimprove\\b',question,re.I|re.S):\n            kind='educational_recommendation'\n        return {'enough_evidence':'yes' if status=='sufficient' else 'no','evidence_status':status,'request_type':kind,\n            'reason':reason.strip(),'missing_information':missing.strip(),'supporting_evidence':json.dumps(clean,ensure_ascii=False),\n            'used_sources':' '.join(refs),'validation_error':''}\n    except (ValueError,TypeError,KeyError) as exc:\n        code=str(exc) if isinstance(exc,ValueError) and str(exc) in {\n            'model_unavailable','invalid_json','multiple_json_objects','model_object_required','incomplete_model_response',\n            'invalid_model_fields','invalid_source_map','unknown_source_reference','invalid_supporting_quote',\n            'quote_not_in_record','incomplete_supporting_evidence'} else 'invalid_model_fields'\n        return failed(code)\n\ndef main(raw: str, source_texts_json: str, question: str, required_source: str) -> dict:\n    result=validate_record(raw,source_texts_json,question)\n    if result['enough_evidence']=='yes' and required_source not in re.findall(r'\\[[^\\]\\n]+\\]',result['used_sources']):\n        result.update(enough_evidence='no',evidence_status='unverified',validation_error='verified_source_not_used',\n            reason=parent_failure('verified_source_not_used'),missing_information='An answer supported by the school-verified record.')\n    return result\n"
