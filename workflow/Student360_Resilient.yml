 યોજના અપડેટ કરી\",\n\"શિક્ષકે સૂચવેલી યોજના મંજૂર કરી\",\n\"શાળાએ આપેલો રેકોર્ડ વપરાયો\",\n\"હાલનો રેકોર્ડ પુષ્ટિ થયો\",\n\"શાળાની માહિતી ચકાસણી માટે રાખી\"\n],\n\"kn\": [\n\"ವಿದ್ಯಾರ್ಥಿ ಪ್ರಗತಿ ವರದಿ\",\n\"ನಿಮ್ಮ ಉತ್ತರ\",\n\"ಶಿಕ್ಷಕರು ಅನುಮೋದಿಸಿದ ಯೋಜನೆ\",\n\"ಶಿಕ್ಷಕರು ಅನುಮೋದಿಸಿದ ಯೋಜನೆ (ಅನುವಾದ)\",\n\"ಇನ್ನೂ ಬೇಕಾದ ಮಾಹಿತಿ\",\n\"ವರದಿಯ ವಿವರಗಳು\",\n\"ವಿದ್ಯಾರ್ಥಿ\",\n\"ವಿನಂತಿಯ ಫಲಿತಾಂಶ\",\n\"ಬೆಂಬಲ ಮಾಹಿತಿ\",\n\"ಪರಿಶೀಲನೆಯ ಸ್ಥಿತಿ\",\n\"ವರದಿಯ ಭಾಷೆ\",\n\"ಪರಿಶೀಲನೆಯಲ್ಲಿನ ಬದಲಾವಣೆಗಳು\",\n\"ಮೂಲಗಳು\",\n\"ಪರಿಶೀಲಿಸಿದ ದಾಖಲೆಗಳು\",\n\"ಶಾಲಾ ದಾಖಲೆಯ ಉಲ್ಲೇಖ\",\n\"ದಯವಿಟ್ಟು ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರನ್ನು ದೃಢೀಕರಿಸಿ\",\n\"ಈ ದಾಖಲೆಗಳು ಕೇಳಿದ ಮಾಹಿತಿಯನ್ನು ಇನ್ನೂ ದೃಢಪಡಿಸುವುದಿಲ್ಲ.\",\n\"ಇದು ಪರಿಶೀಲಿಸಿದ ಮೂಲ ಪಠ್ಯದ ಅನುವಾದ; ಮೂಲ ಪದಗಳು ಪರಿಶೀಲನಾ ದಾಖಲೆಯಲ್ಲಿ ಉಳಿದಿವೆ.\",\n\"ಪ್ರಗತಿಯ ಉತ್ತರ ಸಿದ್ಧ\",\n\"ಶಾಲಾ ಪರಿಶೀಲನೆ\",\n\"ಶಿಕ್ಷಕರ ಪರಿಶೀಲನೆ\",\n\"ವಿದ್ಯಾರ್ಥಿಯ ದಾಖಲೆ ಸಿಗಲಿಲ್ಲ\",\n\"ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರಿನ ಸ್ಪಷ್ಟನೆ ಅಗತ್ಯ\",\n\"ಉತ್ತರ ಸಿದ್ಧ\",\n\"ಶಾಲೆ ಪರಿಶೀಲಿಸಿದ ಉತ್ತರ ಸಿದ್ಧ\",\n\"ಕಲಿಕಾ ಯೋಜನೆ ಅನುಮೋದಿಸಲಾಗಿದೆ\",\n\"ಶಾಲೆಯ ಮಾಹಿತಿ ಸ್ವೀಕರಿಸಲಾಗಿದೆ; ಉತ್ತರ ಬಾಕಿ ಇದೆ\",\n\"ಲಭ್ಯ ದಾಖಲೆಗಳಿಂದ ಬೆಂಬಲಿತ\",\n\"ಶಾಲೆ ಪರಿಶೀಲಿಸಿದ ದಾಖಲೆಯಿಂದ ದೃಢೀಕೃತ\",\n\"ಹೆಚ್ಚಿನ ಮಾಹಿತಿ ಅಗತ್ಯ\",\n\"ಬೆಂಬಲ ಮಾಹಿತಿಯನ್ನು ಪರಿಶೀಲಿಸಬೇಕು\",\n\"ಬೆಂಬಲ ಮಾಹಿತಿಯನ್ನು ಪರೀಕ್ಷಿಸಬೇಕು\",\n\"ಉತ್ತರ ಇನ್ನೊಂದು ಪರಿಶೀಲನೆಗಾಗಿ ಕಾಯುತ್ತಿದೆ\",\n\"ಪರಿಶೀಲನೆ ಅಗತ್ಯವಿಲ್ಲ\",\n\"ಶಿಕ್ಷಕರು ಅನುಮೋದಿಸಿದ್ದಾರೆ\",\n\"ಯೋಜನೆ ಅನುಮೋದನೆಯಾಗಿಲ್ಲ\",\n\"ಪರಿಶೀಲನೆ ಸಮಯಕ್ಕೆ ಮುಗಿಯಲಿಲ್ಲ\",\n\"ಕಾಣೆಯಾದ ಮಾಹಿತಿಗಾಗಿ ಕಾಯಲಾಗುತ್ತಿದೆ\",\n\"ಶಾಲೆ ಉತ್ತರವನ್ನು ದೃಢಪಡಿಸಿದೆ\",\n\"ಪರಿಶೀಲನೆ ಅಗತ್ಯ\",\n\"ಶಿಕ್ಷಕರು ಯೋಜನೆಯನ್ನು ನವೀಕರಿಸಿದರು\",\n\"ಶಿಕ್ಷಕರು ಪ್ರಸ್ತಾಪಿತ ಯೋಜನೆಯನ್ನು ಅನುಮೋದಿಸಿದರು\",\n\"ಶಾಲೆ ನೀಡಿದ ದಾಖಲೆಯನ್ನು ಬಳಸಲಾಗಿದೆ\",\n\"ಇರುವ ದಾಖಲೆಯನ್ನು ದೃಢೀಕರಿಸಲಾಗಿದೆ\",\n\"ಶಾಲೆಯ ಮಾಹಿತಿಯನ್ನು ಪರಿಶೀಲನೆಗಾಗಿ ಇರಿಸಲಾಗಿದೆ\"\n],\n\"or\": [\n\"ଛାତ୍ରଛାତ୍ରୀ ପ୍ରଗତି ରିପୋର୍ଟ\",\n\"ଆପଣଙ୍କ ଉତ୍ତର\",\n\"ଶିକ୍ଷକ ଅନୁମୋଦିତ ଯୋଜନା\",\n\"ଶିକ୍ଷକ ଅନୁମୋଦିତ ଯୋଜନା (ଅନୁବାଦ)\",\n\"ଏବେ ବି ଆବଶ୍ୟକ ସୂଚନା\",\n\"ରିପୋର୍ଟ ବିବରଣୀ\",\n\"ଛାତ୍ରଛାତ୍ରୀ\",\n\"ଅନୁରୋଧର ଫଳାଫଳ\",\n\"ସହାୟକ ସୂଚନା\",\n\"ସମୀକ୍ଷା ସ୍ଥିତି\",\n\"ରିପୋର୍ଟ ଭାଷା\",\n\"ସମୀକ୍ଷାରେ ପରିବର୍ତ୍ତନ\",\n\"ଉତ୍ସ\",\n\"ଯାଞ୍ଚ ହୋଇଥିବା ରେକର୍ଡ୍\",\n\"ବିଦ୍ୟାଳୟ ରେକର୍ଡ୍ ସୂତ୍ର\",\n\"ଦୟାକରି ଛାତ୍ରଛାତ୍ରୀଙ୍କ ନାମ ନିଶ୍ଚିତ କରନ୍ତୁ\",\n\"ଏହି ରେକର୍ଡ୍ ଏପର୍ଯ୍ୟନ୍ତ ମାଗିଥିବା ସୂଚନା ନିଶ୍ଚିତ କରୁନାହିଁ।\",\n\"ଏହା ସମୀକ୍ଷିତ ମୂଳ ପାଠ୍ୟର ଅନୁବାଦ; ମୂଳ ଶବ୍ଦ ସମୀକ୍ଷା ରେକର୍ଡ୍‌ରେ ରହିଛି।\",\n\"ପ୍ରଗତିର ଉତ୍ତର ପ୍ରସ୍ତୁତ\",\n\"ବିଦ୍ୟାଳୟ ସମୀକ୍ଷା\",\n\"ଶିକ୍ଷକ ସମୀକ୍ଷା\",\n\"ଛାତ୍ରଛାତ୍ରୀଙ୍କ ରେକର୍ଡ୍ ମିଳିଲା ନାହିଁ\",\n\"ଛାତ୍ରଛାତ୍ରୀଙ୍କ ନାମ ସ୍ପଷ୍ଟ କରିବା ଆବଶ୍ୟକ\",\n\"ଉତ୍ତର ପ୍ରସ୍ତୁତ\",\n\"ବିଦ୍ୟାଳୟ ଯାଞ୍ଚ କରିଥିବା ଉତ୍ତର ପ୍ରସ୍ତୁତ\",\n\"ଶିକ୍ଷଣ ଯୋଜନା ଅନୁମୋଦିତ\",\n\"ବିଦ୍ୟାଳୟର ସୂଚନା ମିଳିଛି; ଉତ୍ତର ବାକି\",\n\"ଉପଲବ୍ଧ ରେକର୍ଡ୍ ଦ୍ୱାରା ସମର୍ଥିତ\",\n\"ବିଦ୍ୟାଳୟ ଯାଞ୍ଚ କରିଥିବା ରେକର୍ଡ୍‌ରୁ ନିଶ୍ଚିତ\",\n\"ଅଧିକ ସୂଚନା ଆବଶ୍ୟକ\",\n\"ସହାୟକ ସୂଚନା ଯାଞ୍ଚ ଆବଶ୍ୟକ\",\n\"ସହାୟକ ସୂଚନା ପରୀକ୍ଷା ଆବଶ୍ୟକ\",\n\"ଉତ୍ତର ଆଉ ଏକ ଯାଞ୍ଚ ପାଇଁ ଅପେକ୍ଷାରେ\",\n\"ସମୀକ୍ଷା ଆବଶ୍ୟକ ନାହିଁ\",\n\"ଶିକ୍ଷକ ଅନୁମୋଦନ କରିଛନ୍ତି\",\n\"ଯୋଜନା ଅନୁମୋଦିତ ହୋଇନାହିଁ\",\n\"ସମୀକ୍ଷା ସମୟରେ ସମ୍ପୂର୍ଣ୍ଣ ହୋଇନାହିଁ\",\n\"ଅନୁପସ୍ଥିତ ସୂଚନା ପାଇଁ ଅପେକ୍ଷା\",\n\"ବିଦ୍ୟାଳୟ ଉତ୍ତର ନିଶ୍ଚିତ କରିଛି\",\n\"ସମୀକ୍ଷା ଆବଶ୍ୟକ\",\n\"ଶିକ୍ଷକ ଯୋଜନା ଅଦ୍ୟତନ କରିଛନ୍ତି\",\n\"ଶିକ୍ଷକ ପ୍ରସ୍ତାବିତ ଯୋଜନା ଅନୁମୋଦନ କରିଛନ୍ତି\",\n\"ବିଦ୍ୟାଳୟ ଦେଇଥିବା ରେକର୍ଡ୍ ବ୍ୟବହୃତ\",\n\"ବିଦ୍ୟମାନ ରେକର୍ଡ୍ ନିଶ୍ଚିତ\",\n\"ବିଦ୍ୟାଳୟର ସୂଚନା ଯାଞ୍ଚ ପାଇଁ ରଖାଗଲା\"\n],\n\"ml\": [\n\"വിദ്യാർത്ഥി പുരോഗതി റിപ്പോർട്ട്\",\n\"നിങ്ങളുടെ മറുപടി\",\n\"അധ്യാപകർ അംഗീകരിച്ച പദ്ധതി\",\n\"അധ്യാപകർ അംഗീകരിച്ച പദ്ധതി (പരിഭാഷ)\",\n\"ഇനിയും ആവശ്യമായ വിവരങ്ങൾ\",\n\"റിപ്പോർട്ട് വിശദാംശങ്ങൾ\",\n\"വിദ്യാർത്ഥി\",\n\"അഭ്യർത്ഥനയുടെ ഫലം\",\n\"പിന്തുണയ്ക്കുന്ന വിവരങ്ങൾ\",\n\"അവലോകന നില\",\n\"റിപ്പോർട്ടിന്റെ ഭാഷ\",\n\"അവലോകനത്തിലെ മാറ്റങ്ങൾ\",\n\"ഉറവിടങ്ങൾ\",\n\"പരിശോധിച്ച രേഖകൾ\",\n\"സ്കൂൾ രേഖയുടെ പരാമർശം\",\n\"ദയവായി വിദ്യാർത്ഥിയുടെ പേര് സ്ഥിരീകരിക്കൂ\",\n\"ഈ രേഖകൾ ആവശ്യപ്പെട്ട വിവരം ഇതുവരെ സ്ഥിരീകരിക്കുന്നില്ല.\",\n\"ഇത് അവലോകനം ചെയ്ത മൂലരൂപത്തിന്റെ പരിഭാഷയാണ്; മൂലപദങ്ങൾ അവലോകന രേഖയിൽ സൂക്ഷിച്ചിരിക്കുന്നു.\",\n\"പുരോഗതി മറുപടി തയ്യാർ\",\n\"സ്കൂൾ അവലോകനം\",\n\"അധ്യാപക അവലോകനം\",\n\"വിദ്യാർത്ഥിയുടെ രേഖ കണ്ടെത്താനായില്ല\",\n\"വിദ്യാർത്ഥിയുടെ പേരിൽ വ്യക്തത ആവശ്യമാണ്\",\n\"മറുപടി തയ്യാർ\",\n\"സ്കൂൾ സ്ഥിരീകരിച്ച മറുപടി തയ്യാർ\",\n\"പഠനപദ്ധതി അംഗീകരിച്ചു\",\n\"സ്കൂളിന്റെ വിവരം ലഭിച്ചു; മറുപടി ബാക്കി\",\n\"ലഭ്യമായ രേഖകൾ പിന്തുണയ്ക്കുന്നു\",\n\"സ്കൂൾ സ്ഥിരീകരിച്ച രേഖയിൽ നിന്ന് സ്ഥിരീകരിച്ചത്\",\n\"കൂടുതൽ വിവരം ആവശ്യമാണ്\",\n\"പിന്തുണ വിവരങ്ങൾ സ്ഥിരീകരിക്കണം\",\n\"പിന്തുണ വിവരങ്ങൾ പരിശോധിക്കണം\",\n\"മറുപടി മറ്റൊരു പരിശോധനയ്ക്കായി കാത്തിരിക്കുന്നു\",\n\"അവലോകനം ആവശ്യമില്ല\",\n\"അധ്യാപകർ അംഗീകരിച്ചു\",\n\"പദ്ധതി അംഗീകരിച്ചില്ല\",\n\"അവലോകനം സമയത്ത് പൂർത്തിയായില്ല\",\n\"കാണാത്ത വിവരങ്ങൾക്കായി കാത്തിരിക്കുന്നു\",\n\"സ്കൂൾ മറുപടി സ്ഥിരീകരിച്ചു\",\n\"അവലോകനം ആവശ്യമാണ്\",\n\"അധ്യാപകർ പദ്ധതി പുതുക്കി\",\n\"അധ്യാപകർ നിർദ്ദേശിച്ച പദ്ധതി അംഗീകരിച്ചു\",\n\"സ്കൂൾ നൽകിയ രേഖ ഉപയോഗിച്ചു\",\n\"നിലവിലുള്ള രേഖ സ്ഥിരീകരിച്ചു\",\n\"സ്കൂളിന്റെ വിവരങ്ങൾ പരിശോധനയ്ക്കായി സൂക്ഷിച്ചു\"\n],\n\"pa\": [\n\"ਵਿਦਿਆਰਥੀ ਤਰੱਕੀ ਰਿਪੋਰਟ\",\n\"ਤੁਹਾਡਾ ਜਵਾਬ\",\n\"ਅਧਿਆਪਕ ਵੱਲੋਂ ਮਨਜ਼ੂਰ ਯੋਜਨਾ\",\n\"ਅਧਿਆਪਕ ਵੱਲੋਂ ਮਨਜ਼ੂਰ ਯੋਜਨਾ (ਅਨੁਵਾਦ)\",\n\"ਅਜੇ ਵੀ ਲੋੜੀਂਦੀ ਜਾਣਕਾਰੀ\",\n\"ਰਿਪੋਰਟ ਦੇ ਵੇਰਵੇ\",\n\"ਵਿਦਿਆਰਥੀ\",\n\"ਬੇਨਤੀ ਦਾ ਨਤੀਜਾ\",\n\"ਸਹਾਇਕ ਜਾਣਕਾਰੀ\",\n\"ਸਮੀਖਿਆ ਦੀ ਸਥਿਤੀ\",\n\"ਰਿਪੋਰਟ ਦੀ ਭਾਸ਼ਾ\",\n\"ਸਮੀਖਿਆ ਵਿੱਚ ਤਬਦੀਲੀਆਂ\",\n\"ਸਰੋਤ\",\n\"ਜਾਂਚੇ ਗਏ ਰਿਕਾਰਡ\",\n\"ਸਕੂਲ ਰਿਕਾਰਡ ਦਾ ਹਵਾਲਾ\",\n\"ਕਿਰਪਾ ਕਰਕੇ ਵਿਦਿਆਰਥੀ ਦੇ ਨਾਮ ਦੀ ਪੁਸ਼ਟੀ ਕਰੋ\",\n\"ਇਹ ਰਿਕਾਰਡ ਅਜੇ ਮੰਗੀ ਗਈ ਜਾਣਕਾਰੀ ਦੀ ਪੁਸ਼ਟੀ ਨਹੀਂ ਕਰਦੇ।\",\n\"ਇਹ ਸਮੀਖਿਆ ਕੀਤੇ ਮੂਲ ਪਾਠ ਦਾ ਅਨੁਵਾਦ ਹੈ; ਮੂਲ ਸ਼ਬਦ ਸਮੀਖਿਆ ਰਿਕਾਰਡ ਵਿੱਚ ਸੁਰੱਖਿਅਤ ਹਨ।\",\n\"ਤਰੱਕੀ ਦਾ ਜਵਾਬ ਤਿਆਰ\",\n\"ਸਕੂਲ ਸਮੀਖਿਆ\",\n\"ਅਧਿਆਪਕ ਸਮੀਖਿਆ\",\n\"ਵਿਦਿਆਰਥੀ ਦਾ ਰਿਕਾਰਡ ਨਹੀਂ ਮਿਲਿਆ\",\n\"ਵਿਦਿਆਰਥੀ ਦੇ ਨਾਮ ਦੀ ਸਪੱਸ਼ਟਤਾ ਲੋੜੀਂਦੀ ਹੈ\",\n\"ਜਵਾਬ ਤਿਆਰ\",\n\"ਸਕੂਲ ਵੱਲੋਂ ਪੁਸ਼ਟੀ ਕੀਤਾ ਜਵਾਬ ਤਿਆਰ\",\n\"ਸਿੱਖਣ ਯੋਜਨਾ ਮਨਜ਼ੂਰ\",\n\"ਸਕੂਲ ਦੀ ਜਾਣਕਾਰੀ ਮਿਲ ਗਈ; ਜਵਾਬ ਬਕਾਇਆ\",\n\"ਉਪਲਬਧ ਰਿਕਾਰਡ ਦੁਆਰਾ ਸਮਰਥਿਤ\",\n\"ਸਕੂਲ ਵੱਲੋਂ ਪੁਸ਼ਟੀ ਕੀਤੇ ਰਿਕਾਰਡ ਤੋਂ ਪੁਸ਼ਟ\",\n\"ਹੋਰ ਜਾਣਕਾਰੀ ਲੋੜੀਂਦੀ ਹੈ\",\n\"ਸਹਾਇਕ ਜਾਣਕਾਰੀ ਦੀ ਪੁਸ਼ਟੀ ਲੋੜੀਂਦੀ ਹੈ\",\n\"ਸਹਾਇਕ ਜਾਣਕਾਰੀ ਦੀ ਜਾਂਚ ਲੋੜੀਂਦੀ ਹੈ\",\n\"ਜਵਾਬ ਇੱਕ ਹੋਰ ਜਾਂਚ ਦੀ ਉਡੀਕ ਵਿੱਚ ਹੈ\",\n\"ਸਮੀਖਿਆ ਲੋੜੀਂਦੀ ਨਹੀਂ\",\n\"ਅਧਿਆਪਕ ਨੇ ਮਨਜ਼ੂਰ ਕੀਤਾ\",\n\"ਯੋਜਨਾ ਮਨਜ਼ੂਰ ਨਹੀਂ ਹੋਈ\",\n\"ਸਮੀਖਿਆ ਸਮੇਂ ਸਿਰ ਪੂਰੀ ਨਹੀਂ ਹੋਈ\",\n\"ਗੁੰਮ ਜਾਣਕਾਰੀ ਦੀ ਉਡੀਕ\",\n\"ਸਕੂਲ ਨੇ ਜਵਾਬ ਦੀ ਪੁਸ਼ਟੀ ਕੀਤੀ\",\n\"ਸਮੀਖਿਆ ਲੋੜੀਂਦੀ ਹੈ\",\n\"ਅਧਿਆਪਕ ਨੇ ਯੋਜਨਾ ਅੱਪਡੇਟ ਕੀਤੀ\",\n\"ਅਧਿਆਪਕ ਨੇ ਪ੍ਰਸਤਾਵਿਤ ਯੋਜਨਾ ਮਨਜ਼ੂਰ ਕੀਤੀ\",\n\"ਸਕੂਲ ਵੱਲੋਂ ਦਿੱਤਾ ਰਿਕਾਰਡ ਵਰਤਿਆ ਗਿਆ\",\n\"ਮੌਜੂਦਾ ਰਿਕਾਰਡ ਦੀ ਪੁਸ਼ਟੀ ਹੋਈ\",\n\"ਸਕੂਲ ਦੀ ਜਾਣਕਾਰੀ ਜਾਂਚ ਲਈ ਰੱਖੀ ਗਈ\"\n]\n}\n\ndef main(result: dict, content: dict, language_code: str, language_name: str) -> dict:\n    L = T.get(language_code) or T['en']\n    (report, answer, plan, translated_plan, missing, details, student, outcome_l, evidence_l, review_l,\n     language_l, changes_l, sources, checked, reference, unknown, unresolved, translation_note) = L[:18]\n    o, e, r, c = L[18:26], L[26:32], L[32:40], L[40:45]\n    routes = {'fully_automated': o[0], 'insufficient_evidence': o[1], 'teacher_review': o[2],\n              'student_not_found': o[3], 'clarification_required': o[4]}\n    evidence = {'submission_received': e[0], 'sufficient': e[1], 'staff_verified': e[2],\n                'insufficient': e[3], 'unverified': e[4]}\n    reviews = {'answer_pending': r[0], 'not_required': r[1], 'teacher_approved': r[2], 'not_approved': r[3],\n               'timed_out': r[4], 'evidence_pending': r[5], 'staff_confirmed': r[6]}\n    changes = {'teacher_edited': c[0], 'approved_unchanged': c[1], 'school_record_used': c[2],\n               'existing_record_confirmed': c[3], 'submission_retained': c[4]}\n    review = str(result.get('review_status') or '')\n    refs = list(dict.fromkeys(re.findall(r'\\[[^\\]\\n]+\\]', str(result.get('sources') or ''))))\n    def clean(text):\n        value = str(text or '')\n        for ref in refs:\n            value = value.replace(ref, '')\n        value = re.sub(r'[ \\t]+([.,;:!?])', r'\\1', value)\n        value = re.sub(r'[ \\t]+\\n', '\\n', value)\n        value = re.sub(r' {2,}', ' ', value)\n        return value.strip()\n    heading = answer\n    if review == 'teacher_approved':\n        heading = translated_plan if content.get('translation_status') == 'translated' else plan\n    lines = ['# Student 360', '## ' + report]\n    if content.get('notice'):\n        lines.append('> ' + content['notice'])\n    # English teacher approvals retain the submitted wording exactly.\n    body = str(content.get('answer') or '') if review == 'teacher_approved' and language_code == 'en' else clean(content.get('answer'))\n    lines += ['### ' + heading, body]\n    if content.get('missing_information'):\n        lines += ['### ' + missing, clean(content['missing_information'])]\n    if content.get('translation_status') == 'translated' and review in {'teacher_approved', 'staff_confirmed'}:\n        lines.append('> ' + translation_note)\n    outcome = routes.get(str(result.get('route')), o[5])\n    if review == 'staff_confirmed':\n        outcome = o[6]\n    if review == 'teacher_approved':\n        outcome = o[7]\n    lines += ['### ' + details, '**' + student + ':** ' + str(result.get('student_alias') or unknown),\n              '**' + outcome_l + ':** ' + outcome]\n    if result.get('route') not in {'student_not_found', 'clarification_required'}:\n        lines += ['**' + evidence_l + ':** ' + evidence.get(str(result.get('evidence_status')), e[5]),\n                  '**' + review_l + ':** ' + reviews.get(review, r[7])]\n    lines.append('**' + language_l + ':** ' + language_name)\n    if result.get('change_status') in changes:\n        lines.append('**' + changes_l + ':** ' + changes[result['change_status']])\n    if refs:\n        pending = review in {'evidence_pending', 'answer_pending'} or (review == 'timed_out' and result.get('route') == 'insufficient_evidence')\n        lines += ['### ' + (checked if pending else sources)]\n        for ref in refs:\n            if ref == '[School record]':\n                ref_text = re.sub(r'[\\n\\r]', ' ', str(result.get('staff_record_reference') or '')).strip()\n                lines.append('- ' + ref + (' ' + reference + ': ' + ref_text if ref_text else ''))\n            else:\n                lines.append('- ' + ref)\n        if pending:\n            lines.append(unresolved)\n    return {'student_progress_report': '\\n\\n'.join(lines)}\n"
        variables:
        - variable: result
          value_selector:
          - final_aggregate
          - output
        - variable: content
          value_selector:
          - report_content
          - output
        - variable: language_code
          value_selector:
          - report_prepare
          - language_code
        - variable: language_name
          value_selector:
          - report_prepare
          - language_name
        outputs:
          student_progress_report:
            type: string
            children: null
