        code: "import json,re\ndef main(student_alias: str, question: str, record_extract: str, record_reference: str, review_note: str,\n         action_id: str, source_texts_json: str) -> dict:\n    extract=(record_extract or '').strip()\n    reference=(record_reference or '').strip()\n    note=(review_note or '').strip()\n    submission={'record_extract':extract,'record_reference':reference,'review_note':note,\n                'action':action_id,'verification_status':'awaiting_verification','scope':'this_request'}\n    try: docs=json.loads(source_texts_json)\n    except (ValueError,TypeError): docs={}\n    if not isinstance(docs,dict): docs={}\n    def output(ready,reason,context='',required_source=''):\n        return {'ready':ready,'reason':reason,'context':context,'source_texts_json':json.dumps(docs,ensure_ascii=False),\n                'sources_json':json.dumps(list(docs)),\n                'required_source':required_source,'submission':submission}\n    if action_id=='request_records':\n        return output('no','The school has requested the missing record before confirming the answer.')\n    if action_id not in {'confirm_existing','use_school_record'}:\n        return output('no','The school must choose how to verify the record.')\n    if len(reference)>240 or len(extract)>12000 or len(note)>4000:\n        return output('no','The school submission is too long. Please provide the relevant extract and a short record reference.')\n    if len(extract)<20 or not re.search(r'[A-Za-z\\u3400-\\u9fff]',extract):\n        return output('no','The school submission needs the readable record text, including the student, exam or subject, date and result. A number alone cannot confirm the answer.')\n    if any(name!=student_alias and re.search(r'\\b'+re.escape(name)+r'\\b',extract,re.I) for name in ['Aarav','Ishita','Kavya']):\n        return output('no','The submitted extract mentions another student. Please provide only this student’s record.')\n    normalize=lambda s:re.sub(r'\\s+',' ',s).strip()\n    if action_id=='confirm_existing':\n        candidates=list(docs)\n        if reference:\n            ref=reference if reference.startswith('[') and reference.endswith(']') else '['+reference+']'\n            candidates=[ref] if ref in docs else []\n        matches=[ref for ref in candidates if any(normalize(extract) in normalize(str(text)) for text in docs[ref])]\n        if not matches:\n            return output('no','The extract does not match an available student record. Please supply the readable school record or request the missing record.')\n        ref=matches[0]\n        docs={ref:docs[ref]}\n        submission['verification_status']='school_attested_existing_record'\n        submission['matched_source']=ref\n        context='School verified this existing record for the question.\\nSource '+ref+'\\n'+extract\n        return output('yes','',context,ref)\n    if not re.search(r'\\b'+re.escape(student_alias)+r'\\b',extract,re.I):\n        return output('no','The supplied school record must identify the student before it can be used.')\n    docs['[School record]']=[extract]\n    submission['verification_status']='school_attested_supplied_record'\n    chunks=['Source '+ref+'\\n'+'\\n'.join(map(str,texts)) for ref,texts in docs.items()]\n    context=('The school has verified the supplied record for this request. It may resolve a missing or unreadable fact. '\n             'A legible conflicting value is resolved only when this record explicitly documents a correction. '\n             'A separate record reference is optional metadata; its absence does not make the evidence insufficient.\\n'\n             +('School reference: '+reference+'\\n' if reference else '')+'\\n'+'\\n\\n'.join(chunks))\n    return output('yes','',context,'[School record]')\n"
