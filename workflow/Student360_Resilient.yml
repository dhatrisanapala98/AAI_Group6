        x: 9920
        y: 80
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: Prepare your preferred report language
        desc: The language choice only affects the final report. The original answer, review decision and approved wording stay in the review record.
        selected: false
        code: "import json\nimport re\n\n# Selected value -> (language code, English name, native label)\nLANGS = {\n\"English\": [\n\"en\",\n\"English\",\n\"English\"\n],\n\"Hindi हिन्दी\": [\n\"hi\",\n\"Hindi\",\n\"हिन्दी\"\n],\n\"Bengali বাংলা\": [\n\"bn\",\n\"Bengali\",\n\"বাংলা\"\n],\n\"Telugu తెలుగు\": [\n\"te\",\n\"Telugu\",\n\"తెలుగు\"\n],\n\"Marathi मराठी\": [\n\"mr\",\n\"Marathi\",\n\"मराठी\"\n],\n\"Tamil தமிழ்\": [\n\"ta\",\n\"Tamil\",\n\"தமிழ்\"\n],\n\"Urdu اردو\": [\n\"ur\",\n\"Urdu\",\n\"اردو\"\n],\n\"Gujarati ગુજરાતી\": [\n\"gu\",\n\"Gujarati\",\n\"ગુજરાતી\"\n],\n\"Kannada ಕನ್ನಡ\": [\n\"kn\",\n\"Kannada\",\n\"ಕನ್ನಡ\"\n],\n\"Odia ଓଡ଼ିଆ\": [\n\"or\",\n\"Odia\",\n\"ଓଡ଼ିଆ\"\n],\n\"Malayalam മലയാളം\": [\n\"ml\",\n\"Malayalam\",\n\"മലയാളം\"\n],\n\"Punjabi ਪੰਜਾਬੀ\": [\n\"pa\",\n\"Punjabi\",\n\"ਪੰਜਾਬੀ\"\n],\n\"Assamese অসমীয়া\": [\n\"as\",\n\"Assamese\",\n\"অসমীয়া\"\n],\n\"Maithili मैथिली\": [\n\"mai\",\n\"Maithili\",\n\"मैथिली\"\n],\n\"Santali ᱥᱟᱱᱛᱟᱲᱤ\": [\n\"sat\",\n\"Santali\",\n\"ᱥᱟᱱᱛᱟᱲᱤ\"\n],\n\"Kashmiri کٲشُر\": [\n\"ks\",\n\"Kashmiri\",\n\"کٲشُر\"\n],\n\"Nepali नेपाली\": [\n\"ne\",\n\"Nepali\",\n\"नेपाली\"\n],\n\"Sindhi سنڌي\": [\n\"sd\",\n\"Sindhi\",\n\"سنڌي\"\n],\n\"Konkani कोंकणी\": [\n\"kok\",\n\"Konkani\",\n\"कोंकणी\"\n],\n\"Dogri डोगरी\": [\n\"doi\",\n\"Dogri\",\n\"डोगरी\"\n],\n\"Manipuri (Meitei) ꯃꯤꯇꯩꯂꯣꯟ\": [\n\"mni\",\n\"Manipuri (Meitei)\",\n\"ꯃꯤꯇꯩꯂꯣꯟ\"\n],\n\"Bodo बड़ो\": [\n\"brx\",\n\"Bodo\",\n\"बड़ो\"\n],\n\"Sanskrit संस्कृतम्\": [\n\"sa\",\n\"Sanskrit\",\n\"संस्कृतम्\"\n]\n}\n\ndef main(result: dict, report_language: str) -> dict:\n    selected = (report_language or 'English').strip()\n    code, english, name = LANGS.get(selected, LANGS['English'])\n    content = {key: str(result.get(key) or '') for key in ('answer', 'missing_information', 'staff_evidence')}\n    content['staff_evidence'] = ''\n    content['translation_status'] = 'not_requested'\n    content['notice'] = ''\n    needs_translation = code != 'en'\n    protected = {}\n    payload = {}\n    names = ['Aarav', 'Ishita', 'Kavya']\n    student = str(result.get('student_alias') or '')\n    if student and student not in names:\n        names.append(student)\n    name_pattern = r'\\b(?:' + '|'.join(re.escape(item) for item in names) + r')\\b'\n    pattern = re.compile(\n        r'\\[[^\\]\\n]{1,200}\\]|https?://[^\\s)]+|' + name_pattern +\n        r'|\\b(?:IELTS|TOEFL|PET|KET|CEFR|SAT|CLAT|JEE|NEET|CAT|GRE|GMAT|IMO|NSO|IOQM|NSEJS|CBSE|ICSE|ISC|[ABC][12])\\b|\\d+(?:[.,:/-]\\d+)*(?:%)?', re.I\n    )\n    def letters(number):\n        label = ''\n        while True:\n            label = chr(65 + number % 26) + label\n            number = number // 26 - 1\n            if number < 0:\n                return label\n    def protect(match):\n        token = 'ZXQ' + letters(len(protected)) + 'QXZ'\n        while any(token in value for value in content.values()):\n            token = 'ZXQX' + token + 'XQXZ'\n        protected[token] = match.group(0)\n        return token\n    for key in ('answer', 'missing_information', 'staff_evidence'):\n        payload[key] = pattern.sub(protect, content[key])\n    return {'requires_translation': 'yes' if needs_translation else 'no',\n            'language_code': code, 'language_name': name, 'language_english': english, 'content': content,\n            'translation_payload': json.dumps(payload, ensure_ascii=False),\n            'protected_values': json.dumps(protected, ensure_ascii=False)}\n"
        code_language: python3
        variables:
        - variable: result
          value_selector:
          - final_aggregate
          - output
        - variable: report_language
          value_selector:
          - start
          - report_language
        outputs:
          requires_translation:
            type: string
            children: null
          language_code:
            type: string
            children: null
          language_name:
            type: string
            children: null
          content:
            type: object
            children: null
          translation_payload:
            type: string
            children: null
          protected_values:
            type: string
            children: null
          language_english:
            children: null
            type: string
        version: '1'
