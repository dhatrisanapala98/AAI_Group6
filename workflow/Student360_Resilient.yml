    - id: draft_check
      type: custom
      width: 260
      height: 130
      position:
        x: 3200
        y: 80
      positionAbsolute:
        x: 3200
        y: 80
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: Check answer references
        desc: ''
        selected: false
        code: "import json,re,unicodedata\ndef read_model_object(raw):\n    text=str(raw or '').strip().lstrip('\\ufeff')\n    if text in {'__RECORD_CHECK_UNAVAILABLE__','__TRANSLATION_UNAVAILABLE__',''}:\n        raise ValueError('model_unavailable')\n    text=re.sub(r'<think>.*?</think>','',text,flags=re.I|re.S).strip()\n    if re.search(r'</?think>',text,re.I): raise ValueError('incomplete_model_response')\n    if text.startswith('```'):\n        text=re.sub(r'^```(?:json)?\\s*','',text,flags=re.I)\n        text=re.sub(r'\\s*```\\s*$','',text)\n    try:\n        value=json.loads(text)\n    except (ValueError,TypeError):\n        start=text.find('{')\n        if start<0: raise ValueError('invalid_json')\n        try: value,end=json.JSONDecoder().raw_decode(text[start:])\n        except ValueError: raise ValueError('invalid_json')\n        # Accept a single wrapped JSON object, never select between conflicting objects.\n        if re.search(r'[\\{\\[]',text[start+end:]): raise ValueError('multiple_json_objects')\n    if isinstance(value,str):\n        try: value=json.loads(value)\n        except ValueError: raise ValueError('invalid_json')\n    if not isinstance(value,dict): raise ValueError('model_object_required')\n    return value\ndef normalize_text(value):\n    value=unicodedata.normalize('NFKC',str(value))\n    value=value.translate(str.maketrans({'’':\"'\",'‘':\"'\",'“':'\"','”':'\"','–':'-','—':'-','−':'-'}))\n    return re.sub(r'\\s+',' ',value).strip()\ndef canonical_reference(value,allowed):\n    if not isinstance(value,str): raise ValueError('unknown_source_reference')\n    key=normalize_text(value).strip('[]').strip().casefold()\n    matches=[ref for ref in allowed if normalize_text(ref).strip('[]').strip().casefold()==key]\n    if len(matches)!=1: raise ValueError('unknown_source_reference')\n    return matches[0]\ndef parent_failure(code):\n    if code=='model_unavailable':\n        return 'The school record was received, but the answer service did not complete its check. Please retry the school review.'\n    if code in {'invalid_json','multiple_json_objects','model_object_required','incomplete_model_response','invalid_model_fields'}:\n        return 'The school record was received, but the answer could not be read reliably. Please retry the school review.'\n    if code in {'unknown_source_reference','quote_not_in_record','unknown_answer_reference'}:\n        return 'A supporting statement could not be matched to the referenced record. The school needs to check the record extract and reference.'\n    if code=='verified_source_not_used':\n        return 'The answer check did not use the school-verified record to establish the requested fact. The school needs to review the supporting record.'\n    return 'The submitted record has not yet established all the requested information. The school needs to complete its check before confirming the answer.'\n\ndef main(raw: str, used_sources: str) -> dict:\n    def failed(code):\n        return {'draft_valid':'no','answer':'','sources':'','validation_message':parent_failure(code),'validation_error':code}\n    try:\n        item=read_model_object(raw);answer=item.get('answer');citations=item.get('citations')\n        if not isinstance(answer,str) or not answer.strip() or len(answer)>16000: raise ValueError('invalid_model_fields')\n        if not isinstance(citations,list) or not citations: raise ValueError('incomplete_supporting_evidence')\n        allowed=re.findall(r'\\[[^\\]\\n]+\\]',used_sources)\n        refs=[canonical_reference(c,allowed) for c in citations]\n        actual=re.findall(r'\\[(?:[A-Za-z]+-p\\d+|School record[^\\]\\n]*|Report: [^\\]\\n]+)\\]',answer,re.I)\n        for ref in actual:\n            canonical=canonical_reference(ref,allowed)\n            if canonical not in refs: raise ValueError('unknown_answer_reference')\n            answer=answer.replace(ref,canonical)\n        # Sources can be supplied in the citations array without repeating them inside the parent answer.\n        # Every listed source must still be among the previously validated supporting references.\n        return {'draft_valid':'yes','answer':answer,'sources':' '.join(dict.fromkeys(refs)),\n            'validation_message':'','validation_error':''}\n    except (ValueError,TypeError,KeyError) as exc:\n        code=str(exc) if isinstance(exc,ValueError) and str(exc) in {\n            'model_unavailable','invalid_json','multiple_json_objects','model_object_required','incomplete_model_response',\n            'invalid_model_fields','incomplete_supporting_evidence','unknown_source_reference','unknown_answer_reference'} else 'invalid_model_fields'\n        return failed(code)\n"
        code_language: python3
        variables:
        - variable: raw
          value_selector:
          - draft
          - text
        - variable: used_sources
          value_selector:
          - assessment_check
          - used_sources
        outputs:
          draft_valid:
            type: string
            children: null
          answer:
            type: string
            children: null
          sources:
            type: string
            children: null
          validation_message:
            type: string
            children: null
          validation_error:
            type: string
            children: null
        version: '1'
